# 本地开发依赖：MySQL（身份库）+ PostgreSQL（业务库）
#
# 启动：
#   docker compose up -d
# 停止：
#   docker compose down
# 清空数据（谨慎）：
#   docker compose down -v
#
# 账号与 .env 默认值一致：
#   MySQL:     agent_user / 123456 @ 127.0.0.1:3306 / charge_identity
#   PostgreSQL: agent_user / 123456 @ 127.0.0.1:5432 / charge_identity_agent
#
# 注意：生产环境不要使用这些开发密码，请改用云数据库并配置强密码。

name: neighborhood-charging

services:
  mysql:
    image: mysql:8.0
    container_name: nc-mysql
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: "123456"
      MYSQL_DATABASE: charge_identity
      MYSQL_USER: agent_user
      MYSQL_PASSWORD: "123456"
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p123456"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  postgres:
    image: pgvector/pgvector:pg16
    container_name: nc-postgres
    environment:
      POSTGRES_DB: charge_identity_agent
      POSTGRES_USER: agent_user
      POSTGRES_PASSWORD: "123456"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent_user -d charge_identity_agent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  mysql_data:
  postgres_data:
